[project]
name = "negotia"
version = "0.1.0"
description = "Backend foundation for an agentic AI negotiation practice and coaching platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.58",
    "fastapi>=0.140.9",
    "langgraph>=1.2.10",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
